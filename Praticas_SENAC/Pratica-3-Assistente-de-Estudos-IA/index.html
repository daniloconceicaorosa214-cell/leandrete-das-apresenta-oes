<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente de Estudos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Assistente de Estudos</h1>

        <p>Digite sua dúvida e receba uma explicação da IA.</p>

        <form id="form">

            <textarea
                id="pergunta"
                placeholder="Digite sua dúvida..."
                rows="5"
            ></textarea>

            <button type="submit" id="botao">
                Perguntar
            </button>

        </form>

        <p id="status"></p>

        <div id="resposta" class="resposta"></div>

        <h2>Histórico de perguntas</h2>

        <div id="historico"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
